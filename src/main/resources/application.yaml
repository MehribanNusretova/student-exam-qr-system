spring:
  application:
    name: student-exam-project

  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  mvc:
   cors:
     allowed-origins: "*"
     allowed-methods: "*"
     allowed-headers: "*"
